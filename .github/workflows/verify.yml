name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma generate와 next build는 실제 DB에 연결하지 않지만,
      # DATABASE_URL 형식 검증을 위해 더미 값을 넣는다.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run verification
        run: bash scripts/verify.sh
